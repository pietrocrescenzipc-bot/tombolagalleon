<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tombola Evento - PMU & The Galleon</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #161f30;
      --gold: #f39c12;
      --gold-light: #f1c40f;
      --ball-orange: #ff6600;
      --ball-blue: #0044cc;
      --text-light: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; overflow-x: hidden; }

    header {
      background: linear-gradient(135deg, #111, #1a2536);
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--gold);
      position: sticky; top: 0; z-index: 100;
    }
    .brand-title { font-size: 1.1rem; font-weight: bold; color: var(--gold); text-transform: uppercase; }
    .nav-tabs { display: flex; gap: 6px; }
    .tab-btn {
      background: #222e42; color: #ccc; border: 1px solid #3a4b68;
      padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    }
    .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold-light); }

    .view-section { display: none; padding: 15px; max-width: 900px; margin: 0 auto; }
    .view-section.active { display: block; }

    /* Pallina Biliardo 3D */
    .billiard-ball {
      width: 48px; height: 48px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e6e6e6 50%, #cccccc 100%);
      border: 4px solid var(--ball-orange);
      box-shadow: inset -3px -3px 6px rgba(0,0,0,0.4), inset 3px 3px 6px rgba(255,255,255,0.8), 0 4px 8px rgba(0,0,0,0.5);
      display: inline-flex; justify-content: center; align-items: center;
      font-weight: 900; color: var(--ball-blue); font-size: 1.2rem;
      user-select: none; margin: 0 auto;
    }
    .billiard-ball.drawn {
      background: radial-gradient(circle at 35% 35%, #ff8833 0%, var(--ball-orange) 60%, #cc4400 100%);
      border-color: #ffffff; color: #ffffff;
      box-shadow: 0 0 12px var(--ball-orange);
    }

    /* Tabellone Maxischermo */
    .top-banner {
      background: linear-gradient(90deg, #000, #1a2536, #000);
      padding: 15px; border-radius: 10px; border: 1px solid var(--gold);
      margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .banner-text { font-size: 1.3rem; color: var(--gold); font-weight: bold; }
    .fullscreen-btn { background: var(--gold); color: #000; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .grid-90 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; background: #111a28; padding: 15px; border-radius: 12px; border: 2px solid #2a3b54; }
    .grid-cell { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; background: #1a2638; border-radius: 8px; font-weight: bold; color: #556b8d; border: 1px solid #2c3e59; font-size: 1.2rem; }
    .grid-cell.active { background: transparent; border: none; }
    
    .last-extracted-box {
      margin-top: 20px; background: #162232; padding: 15px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; gap: 15px; border: 1px solid var(--gold);
    }

    /* Banner Scorrevole Vincitori sul Maxischermo */
    .winners-ticker-container {
      margin-top: 15px;
      background: linear-gradient(90deg, #111, #1a2536, #111);
      border: 2px solid var(--gold);
      border-radius: 8px;
      overflow: hidden;
      white-space: nowrap;
      padding: 10px 0;
      display: none;
    }
    .winners-ticker-text {
      display: inline-block;
      padding-left: 100%;
      animation: ticker 25s linear infinite;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--gold-light);
    }
    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* Alert Notifica Regia Super Visibile */
    .regia-alert-box {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: #fff;
      padding: 20px;
      border-radius: 12px;
      border: 3px solid var(--gold);
      box-shadow: 0 0 25px rgba(231, 76, 60, 0.8);
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      display: none;
      animation: pulseAlert 0.8s infinite alternate;
    }
    @keyframes pulseAlert {
      0% { transform: scale(0.99); box-shadow: 0 0 15px rgba(231, 76, 60, 0.6); }
      100% { transform: scale(1.02); box-shadow: 0 0 35px rgba(243, 156, 18, 1); }
    }

    /* Interfaccia Giocatore Mobile-Friendly */
    .player-header { background: #161f30; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px solid #2a3b54; }
    .photo-preview { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; margin: 10px auto; display: block; background: #0a0e17; }
    
    .card-digital { 
      background: #1c283a; 
      border: 2px solid var(--gold); 
      border-radius: 12px; 
      padding: 12px; 
      margin-bottom: 25px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .card-header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #2a3b54; padding-bottom: 6px; font-size: 0.95rem; }
    
    .tombola-classic-grid { 
      display: grid !important; 
      grid-template-columns: repeat(9, 1fr) !important; 
      gap: 3px; 
      background: #0a0e17; 
      padding: 6px; 
      border-radius: 8px; 
      border: 1px solid #2c3e59; 
    }
    .tombola-cell {
      aspect-ratio: 1; 
      background: #162232; 
      border-radius: 4px; 
      display: flex;
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      font-size: 0.95rem;
      color: #fff; 
      cursor: pointer; 
      border: 1px solid #2c3e59; 
      user-select: none;
    }
    .tombola-cell.empty { background: #090d14; border-color: #121a26; cursor: default; }
    .tombola-cell.marked { background: var(--ball-orange); color: #fff; border-color: #fff; box-shadow: inset 0 0 6px rgba(0,0,0,0.5); }

    /* Modalità Cartella a Tutto Schermo PERFETTAMENTE OTTIMIZZATA */
    #fullscreen-card-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 14, 23, 0.98); z-index: 9999;
      display: none; flex-direction: column; padding: 10px;
      justify-content: center; align-items: center; overflow: hidden;
    }
    .fullscreen-card-box {
      width: 98vw; max-width: 900px;
      background: #1c283a; border: 3px solid var(--gold); border-radius: 12px;
      padding: 12px; text-align: center; display: flex; flex-direction: column;
      max-height: 96vh; justify-content: space-between;
    }
    .fullscreen-card-box .tombola-classic-grid {
      gap: 4px; padding: 8px; margin: 10px 0; flex-grow: 1;
      display: grid !important; grid-template-columns: repeat(9, 1fr) !important;
      align-content: center;
    }
    .fullscreen-card-box .tombola-cell {
      font-size: clamp(0.9rem, 3.5vw, 1.8rem);
      aspect-ratio: 1;
      border-radius: 6px;
    }

    /* Controlli Regia */
    .regia-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel-card { background: var(--card-bg); border-radius: 10px; padding: 20px; border: 1px solid #2a3b54; margin-bottom: 20px; }
    .panel-title { color: var(--gold); font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid #2a3b54; padding-bottom: 8px; }
    .btn { background: var(--gold); color: #000; border: none; padding: 12px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 8px; font-size: 1rem; }
    .btn-sm { padding: 8px 12px; font-size: 0.9rem; width: auto; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-success { background: #2ecc71; color: #fff; }
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #aaa; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #3a4b68; background: #0e1622; color: #fff; font-size: 1rem; }

    /* Overlay Estrazione e Vincita */
    #extraction-overlay, #winner-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 14, 23, 0.96); backdrop-filter: blur(12px);
      display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; text-align: center;
    }
    .giant-ball { width: 160px; height: 160px; font-size: 4.5rem; border-width: 8px; }
    .smorfia-sticker { margin-top: 20px; background: #fff; color: #000; padding: 10px 20px; border-radius: 20px; font-size: 1.3rem; font-weight: bold; transform: rotate(-2deg); }
    
    .winner-box {
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(22, 31, 48, 0.98);
      padding: 25px; border-radius: 20px; border: 4px solid var(--gold);
      box-shadow: 0 0 50px rgba(243, 156, 18, 0.7);
      max-width: 95%; width: 1000px; max-height: 90vh; overflow-y: auto;
    }
    .winners-flex-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }
    .winner-card-item {
      background: #0e1622;
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      flex: 1;
      min-width: 240px;
      max-width: 300px;
    }
    .winner-photo {
      width: 110px; height: 110px; border-radius: 50%;
      border: 3px solid var(--gold); object-fit: cover;
      margin: 8px auto; display: block;
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes popIn { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes pulseGlow { 0% { box-shadow: 0 0 20px rgba(243, 156, 18, 0.6); } 100% { box-shadow: 0 0 50px rgba(243, 156, 18, 1); } }

    @media (orientation: landscape) and (max-height: 500px) {
      .fullscreen-card-box { padding: 5px; }
      .fullscreen-card-box .tombola-cell { font-size: clamp(0.7rem, 2.5vh, 1.2rem); }
      #fs-card-title { font-size: 0.9rem !important; margin-bottom: 2px !important; }
      .fullscreen-card-box .btn-danger { padding: 6px !important; font-size: 0.85rem !important; margin-top: 2px !important; }
    }

    @media (max-width: 768px) {
      .regia-grid { grid-template-columns: 1fr; }
      .tombola-cell { font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title" id
