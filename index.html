<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombola Evento - PMU & The Galleon</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151d2a;
            --cell-bg: linear-gradient(180deg, #2b394e 0%, #1c2636 100%);
            --cell-border: #3b4d66;
            --cell-extracted: linear-gradient(180deg, #d35400 0%, #a04000 100%);
            --text-color: #ffffff;
            --gold: #f39c12;
            --blue-btn: #2980b9;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Banner di attivazione Audio */
        #audio-unlock-banner {
            background: linear-gradient(90deg, #e67e22, #d35400);
            color: white;
            text-align: center;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            max-width: 1200px;
            border-radius: 6px;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #audio-unlock-banner:hover {
            background: linear-gradient(90deg, #f39c12, #e67e22);
        }

        /* Top Bar Controlli */
        .top-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .brand-title {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .nav-buttons {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            background-color: var(--blue-btn);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-btn.orange {
            background-color: #e67e22;
        }

        /* Contenitore Principale */
        .main-container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--panel-bg);
            border: 2px solid #2c3e50;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        /* Header Evento */
        .event-header {
            background: linear-gradient(180deg, #1f2d40 0%, #121a26 100%);
            border: 1px solid var(--cell-border);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-bottom: 12px;
            position: relative;
        }

        .btn-fullscreen {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Tabellone 90 numeri */
        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .cell {
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            border-radius: 8px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.2s;
        }

        .cell.extracted {
            background: var(--cell-extracted);
            border-color: #e67e22;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(211, 84, 0, 0.8);
        }

        /* Footer Info Vincita */
        .game-info-footer {
            background: linear-gradient(180deg, #1a2536 0%, #0d131d 100%);
            border: 1px solid var(--cell-border);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            color: var(--gold);
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Banner Sblocco Audio per Browser -->
    <div id="audio-unlock-banner" onclick="unlockAudio()">
        🔊 CLICCA QUI PER ATTIVARE L'AUDIO E LA MUSICA DI SOTTOFONDO
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand-title">PMU & THE GALLEON</div>
        <div class="nav-buttons">
            <button class="nav-btn orange">Maxischermo</button>
            <button class="nav-btn">Regia</button>
            <button class="nav-btn">Le mie Cartelle</button>
            <button class="nav-btn">Pass QR</button>
        </div>
    </div>

    <!-- Pannello Tabellone -->
    <div class="main-container">
        <div class="event-header">
            PALLAVOLO MEDIA UMBRA & THE GALLEON PIZZERIA
            <button class="btn-fullscreen" onclick="toggleFullScreen()">FULLSCREEN</button>
        </div>

        <div class="board" id="board"></div>

        <div class="game-info-footer" id="game-status">
            🎯 SI GIOCA PER: AMBO — PREMIO: BUONO CAFFÈ
        </div>
    </div>

    <!-- Tracce Audio -->
    <audio id="bg-music" src="sottofondo.mp3" loop preload="auto"></audio>
    <audio id="win-sound" src="vincita.mp3" preload="auto"></audio>

    <script>
        const boardEl = document.getElementById('board');
        const bgMusic = document.getElementById('bg-music');
        const winSound = document.getElementById('win-sound');

        // Genera il tabellone 1-90
        function initBoard() {
            boardEl.innerHTML = '';
            for (let i = 1; i <= 90; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `num-${i}`;
                cell.innerText = i;
                cell.onclick = () => toggleNumber(i);
                boardEl.appendChild(cell);
            }
        }
        initBoard();

        // Seleziona/Deseleziona Numero
        function toggleNumber(num) {
            const cell = document.getElementById(`num-${num}`);
            if (cell) {
                cell.classList.toggle('extracted');
            }
        }

        // Funzione per attivare e sbloccare la musica
        function unlockAudio() {
            bgMusic.play().then(() => {
                document.getElementById('audio-unlock-banner').style.display = 'none';
            }).catch(e => {
                console.log("Sblocco audio fallito:", e);
            });

            winSound.load();
        }

        // Riproduce l'effetto vincita
        function triggerWin() {
            winSound.currentTime = 0;
            winSound.play().catch(e => console.log("Errore audio vincita:", e));
        }

        // Schermo Intero
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
