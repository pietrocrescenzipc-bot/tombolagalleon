<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tombola Evento - PMU & The Galleon</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #161f30;
      --gold: #f39c12;
      --gold-light: #f1c40f;
      --ball-orange: #ff6600;
      --ball-blue: #0044cc;
      --text-light: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; overflow-x: hidden; }

    header {
      background: linear-gradient(135deg, #111, #1a2536);
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--gold);
      position: sticky; top: 0; z-index: 100;
    }
    .brand-title { font-size: 1.1rem; font-weight: bold; color: var(--gold); text-transform: uppercase; }
    .nav-tabs { display: flex; gap: 6px; }
    .tab-btn {
      background: #222e42; color: #ccc; border: 1px solid #3a4b68;
      padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    }
    .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold-light); }

    .view-section { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .view-section.active { display: block; }

    /* Pallina Biliardo 3D */
    .billiard-ball {
      width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e6e6e6 50%, #cccccc 100%);
      border: 4px solid var(--ball-orange);
      box-shadow: inset -3px -3px 6px rgba(0,0,0,0.4), inset 3px 3px 6px rgba(255,255,255,0.8), 0 4px 8px rgba(0,0,0,0.5);
      display: inline-flex; justify-content: center; align-items: center;
      font-weight: 900; color: var(--ball-blue); font-size: 1.1rem;
      user-select: none; margin: 0 auto;
    }
    .billiard-ball.drawn {
      background: radial-gradient(circle at 35% 35%, #ff8833 0%, var(--ball-orange) 60%, #cc4400 100%);
      border-color: #ffffff; color: #ffffff;
      box-shadow: 0 0 12px var(--ball-orange);
    }

    /* Tabellone Maxischermo */
    .top-banner {
      background: linear-gradient(90deg, #000, #1a2536, #000);
      padding: 15px; border-radius: 10px; border: 1px solid var(--gold);
      margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .banner-text { font-size: 1.3rem; color: var(--gold); font-weight: bold; }
    .fullscreen-btn { background: var(--gold); color: #000; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .grid-90 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; background: #111a28; padding: 15px; border-radius: 12px; border: 2px solid #2a3b54; }
    .grid-cell { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; background: #1a2638; border-radius: 8px; font-weight: bold; color: #556b8d; border: 1px solid #2c3e59; }
    .grid-cell.active { background: transparent; border: none; }
    
    .last-extracted-box {
      margin-top: 20px; background: #162232; padding: 15px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; gap: 15px; border: 1px solid var(--gold);
    }

    /* Interfaccia Giocatore */
    .player-header { background: #161f30; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; border: 1px solid #2a3b54; }
    .photo-preview { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; margin: 10px auto; display: block; background: #0a0e17; }
    .card-digital { background: #1c283a; border: 2px solid var(--gold); border-radius: 10px; padding: 15px; margin-bottom: 20px; }
    .card-header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #2a3b54; padding-bottom: 8px; }
    .card-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: #0a0e17; padding: 8px; border-radius: 8px; }
    .card-cell { aspect-ratio: 1; background: #162232; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; color: #fff; cursor: pointer; border: 1px solid #2c3e59; }
    .card-cell.marked { background: var(--ball-orange); color: #fff; font-size: 1rem; border-color: #fff; }

    /* Controls & Regia */
    .regia-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel-card { background: var(--card-bg); border-radius: 10px; padding: 20px; border: 1px solid #2a3b54; }
    .panel-title { color: var(--gold); font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid #2a3b54; padding-bottom: 8px; }
    .btn { background: var(--gold); color: #000; border: none; padding: 10px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #aaa; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #3a4b68; background: #0e1622; color: #fff; }

    /* Overlay Estrazione e Vincita */
    #extraction-overlay, #winner-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.88); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 1000;
    }
    .giant-ball { width: 160px; height: 160px; font-size: 4.5rem; border-width: 10px; }
    .smorfia-sticker { margin-top: 20px; background: #fff; color: #000; padding: 12px 25px; border-radius: 25px; font-size: 1.4rem; font-weight: bold; transform: rotate(-2deg); }
    .winner-photo { width: 140px; height: 140px; border-radius: 50%; border: 4px solid var(--gold); object-fit: cover; margin-bottom: 15px; }

    @media (max-width: 768px) { .regia-grid { grid-template-columns: 1fr; } .billiard-ball { width: 32px; height: 32px; font-size: 0.85rem; border-width: 2px; } }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">PMU & The Galleon</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchView('tabellone')">Maxischermo</button>
      <button class="tab-btn" onclick="switchView('regia')">Regia</button>
      <button class="tab-btn" onclick="switchView('giocatore')">Scheda Cliente</button>
      <button class="tab-btn" onclick="switchView('stampa')">Pass QR</button>
    </div>
  </header>

  <!-- TABELLONE MAXISCHERMO -->
  <div id="view-tabellone" class="view-section active">
    <div class="top-banner">
      <div class="banner-text">Pallavolo Media Umbra & The Galleon Pizzeria</div>
      <button class="fullscreen-btn" onclick="toggleFullscreen()">FULLSCREEN</button>
    </div>
    <div class="grid-90" id="board-grid"></div>
    <div class="last-extracted-box">
      <span style="font-size: 1.1rem; color: #aaa;">ULTIMO NUMERO ESTRATTO:</span>
      <div id="last-ball-display" class="billiard-ball drawn" style="width: 55px; height: 55px; font-size: 1.5rem;">--</div>
    </div>
  </div>

  <!-- REGIA CONTROL DASHBOARD -->
  <div id="view-regia" class="view-section">
    <div id="regia-login" class="panel-card" style="max-width: 380px; margin: 40px auto; text-align: center;">
      <h3 class="panel-title">Accesso Regia</h3>
      <div class="form-group">
        <input type="password" id="regia-pass" placeholder="Password (default: PMU2026)">
      </div>
      <button class="btn" onclick="checkRegiaAuth()">Accedi</button>
    </div>

    <div id="regia-content" style="display: none;">
      <div class="regia-grid">
        <div class="panel-card">
          <h3 class="panel-title">Controllo Estrazione</h3>
          <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="btn" onclick="drawNumber()">Estrai Numero</button>
            <button class="btn btn-danger" onclick="resetGame()">Nuova Partita</button>
          </div>
          <h4 style="color: var(--gold); margin-bottom: 10px;">Proclama Vincitore</h4>
          <div class="form-group">
            <label>Seleziona Giocatore Vincente</label>
            <select id="winner-select"></select>
          </div>
          <div class="form-group">
            <label>Tipo di Vincita</label>
            <select id="win-type">
              <option value="AMBO">AMBO</option>
