<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombola Evento - PMU & The Galleon</title>
    <style>
        :root {
            --primary: #c0392b;
            --secondary: #f39c12;
            --bg: #1a1a1a;
            --text: #ffffff;
            --board-bg: #2c3e50;
            --extracted: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Banner per sblocco audio */
        #audio-unlock-banner {
            background-color: #e67e22;
            color: white;
            text-align: center;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            max-width: 900px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }

        #audio-unlock-banner:hover {
            background-color: #d35400;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--secondary);
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Sezione Estrazione Ultimo Numero */
        .display-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--board-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            min-width: 280px;
        }

        .current-number {
            font-size: 6rem;
            font-weight: bold;
            color: var(--secondary);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--secondary);
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            margin: 5px;
        }

        .btn:hover {
            background-color: #e74c3c;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-win {
            background-color: var(--secondary);
            color: #000;
        }

        .btn-win:hover {
            background-color: #f1c40f;
        }

        /* Tabellone 1-90 */
        .board-section {
            background: var(--board-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            max-width: 600px;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #a0a0a0;
            transition: all 0.3s;
        }

        .cell.extracted {
            background-color: var(--extracted);
            color: white;
            font-size: 1.3rem;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.6);
        }

        .cell.latest {
            background-color: var(--secondary);
            color: black;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <!-- Banner sblocco Audio -->
    <div id="audio-unlock-banner" onclick="unlockAudio()">
        🔊 CLICCA QUI PER ATTIVARE L'AUDIO E LA MUSICA DI SOTTOFONDO
    </div>

    <header>
        <h1>🏴‍☠️ Tombola Evento 🏴‍☠️</h1>
        <p>PMU & The Galleon</p>
    </header>

    <div class="container">
        <!-- Pannello di Controllo / Estrazione -->
        <div class="display-section">
            <div class="current-number" id="current-number">--</div>
            <button class="btn" onclick="extractNumber()">ESTRAI NUMERO</button>
            <button class="btn btn-win" onclick="playWinSound()">🏆 VINCITA!</button>
            <button class="btn" style="background-color: #7f8c8d; margin-top: 20px;" onclick="resetGame()">AZZERA TAVOLA</button>
        </div>

        <!-- Tabellone 90 Numeri -->
        <div class="board-section">
            <div class="board" id="board"></div>
        </div>
    </div>

    <!-- Elementi Audio -->
    <audio id="bg-music" src="sottofondo.mp3" loop preload="auto"></audio>
    <audio id="win-sound" src="vincita.mp3" preload="auto"></audio>

    <script>
        const extractedNumbers = new Set();
        let lastExtracted = null;

        // Inizializza Tabellone
        const boardElement = document.getElementById('board');
        function initBoard() {
            boardElement.innerHTML = '';
            for (let i = 1; i <= 90; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                cell.innerText = i;
                boardElement.appendChild(cell);
            }
        }
        initBoard();

        // Sblocco Audio Manuale
        function unlockAudio() {
            const bgMusic = document.getElementById('bg-music');
            const winSound = document.getElementById('win-sound');

            bgMusic.play().then(() => {
                document.getElementById('audio-unlock-banner').style.display = 'none';
            }).catch(err => {
                console.log("Sblocco audio in corso...", err);
            });

            // Pre-carica l'effetto sonoro
            winSound.load();
        }

        // Estrazione Numero
        function extractNumber() {
            if (extractedNumbers.size >= 90) {
                alert("Tutti i numeri sono stati estratti!");
                return;
            }

            let num;
            do {
                num = Math.floor(Math.random() * 90) + 1;
            } while (extractedNumbers.has(num));

            extractedNumbers.add(num);

            // Rimuovi lo stato "latest" dal precedente
            if (lastExtracted) {
                const prevCell = document.getElementById(`cell-${lastExtracted}`);
                if (prevCell) {
                    prevCell.classList.remove('latest');
                    prevCell.classList.add('extracted');
                }
            }

            // Aggiorna numero corrente e tabellone
            lastExtracted = num;
            document.getElementById('current-number').innerText = num;
            const currentCell = document.getElementById(`cell-${num}`);
            if (currentCell) {
                currentCell.classList.add('extracted', 'latest');
            }
        }

        // Suono Vincita
        function playWinSound() {
            const winSound = document.getElementById('win-sound');
            winSound.currentTime = 0;
            winSound.play().catch(e => console.log("Errore audio vincita:", e));
        }

        // Reset Gioco
        function resetGame() {
            if (confirm("Sei sicuro di voler azzerare il tabellone?")) {
                extractedNumbers.clear();
                lastExtracted = null;
                document.getElementById('current-number').innerText = '--';
                initBoard();
            }
        }
    </script>
</body>
</html>
