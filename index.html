<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tombola Evento - PMU & The Galleon</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #161f30;
      --gold: #f39c12;
      --gold-light: #f1c40f;
      --ball-orange: #ff6600;
      --ball-blue: #0044cc;
      --text-light: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; overflow-x: hidden; }

    header {
      background: linear-gradient(135deg, #111, #1a2536);
      padding: 10px 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--gold);
      position: sticky; top: 0; z-index: 100;
    }
    .brand-title { font-size: 1.1rem; font-weight: bold; color: var(--gold); text-transform: uppercase; }
    .nav-tabs { display: flex; gap: 6px; }
    .tab-btn {
      background: #222e42; color: #ccc; border: 1px solid #3a4b68;
      padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    }
    .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold-light); }

    /* Layout Generale Sezioni */
    .view-section { display: none; padding: 10px 15px; width: 100%; margin: 0 auto; }
    .view-section.active { display: block; }

    /* Layout Specifico del Maxischermo per TV (Largo e Proporzionato) */
    #view-tabellone {
      max-width: 1550px !important;
      padding: 10px 20px;
    }

    /* Pallina Biliardo 3D */
    .billiard-ball {
      width: clamp(32px, 3.2vw, 55px);
      height: clamp(32px, 3.2vw, 55px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e6e6e6 50%, #cccccc 100%);
      border: 3px solid var(--ball-orange);
      box-shadow: inset -2px -2px 5px rgba(0,0,0,0.4), inset 2px 2px 5px rgba(255,255,255,0.8), 0 3px 6px rgba(0,0,0,0.5);
      display: inline-flex; justify-content: center; align-items: center;
      font-weight: 900; color: var(--ball-blue); font-size: clamp(0.9rem, 1.4vw, 1.5rem);
      user-select: none; margin: 0 auto;
    }
    .billiard-ball.drawn {
      background: radial-gradient(circle at 35% 35%, #ff8833 0%, var(--ball-orange) 60%, #cc4400 100%);
      border-color: #ffffff; color: #ffffff;
      box-shadow: 0 0 12px var(--ball-orange);
    }

    /* Tabellone Maxischermo */
    .top-banner {
      background: linear-gradient(90deg, #000, #1a2536, #000);
      padding: 10px 20px; border-radius: 10px; border: 1px solid var(--gold);
      margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .banner-text { font-size: clamp(1.1rem, 1.8vw, 1.6rem); color: var(--gold); font-weight: bold; }
    .fullscreen-btn { background: var(--gold); color: #000; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    
    /* Griglia 10x9 perfettamente adatta allo schermo panoramico */
    .grid-90 {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      background: #111a28;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #2a3b54;
      width: 100%;
    }
    .grid-cell {
      aspect-ratio: 1.25;
      display: flex; justify-content: center; align-items: center;
      background: #1a2638; border-radius: 8px; font-weight: bold;
      color: #556b8d; border: 1px solid #2c3e59;
      font-size: clamp(0.9rem, 1.5vw, 1.6rem);
    }
    .grid-cell.active { background: transparent; border: none; }
    
    .last-extracted-box {
      margin-top: 10px; background: #162232; padding: 10px 20px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; gap: 15px; border: 1px solid var(--gold);
    }

    /* Banner Scorrevole Vincitori sul Maxischermo */
    .winners-ticker-container {
      margin-top: 10px;
      background: linear-gradient(90deg, #111, #1a2536, #111);
      border: 2px solid var(--gold);
      border-radius: 8px;
      overflow: hidden;
      white-space: nowrap;
      padding: 8px 0;
      display: none;
    }
    .winners-ticker-text {
      display: inline-block;
      padding-left: 100%;
      animation: ticker 25s linear infinite;
      font-size: clamp(1rem, 1.3vw, 1.3rem);
      font-weight: bold;
      color: var(--gold-light);
    }
    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* Modalità Fullscreen Pulita senza Header */
    :fullscreen header { display: none !important; }
    :fullscreen #view-tabellone { padding-top: 10px !important; }
