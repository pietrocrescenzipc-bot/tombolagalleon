<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Tombola Anni 80 con Regia & Audio</title>
  <style>
    :root {
      --bg-color: #0f051d;
      --panel-bg: rgba(26, 11, 46, 0.85);
      --neon-pink: #ff007f;
      --neon-cyan: #00f3ff;
      --neon-yellow: #f3e600;
      --text-color: #ffffff;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: linear-gradient(rgba(15, 5, 29, 0.9), rgba(15, 5, 29, 0.9)), 
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
    }

    h1 {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
      font-size: 2.5rem;
      margin-bottom: 5px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .subtitle {
      color: var(--neon-pink);
      font-size: 1.1rem;
      text-shadow: 0 0 5px var(--neon-pink);
      margin-bottom: 20px;
      text-align: center;
    }

    /* Container Principale */
    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1200px;
      width: 100%;
    }

    /* Pannelli di Gioco */
    .panel {
      background: var(--panel-bg);
      border: 2px solid var(--neon-pink);
      box-shadow: 0 0 15px var(--neon-pink);
      border-radius: 12px;
      padding: 20px;
      flex: 1;
      min-width: 320px;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .panel h2 {
      color: var(--neon-yellow);
      text-shadow: 0 0 8px var(--neon-yellow);
      margin-top: 0;
      font-size: 1.5rem;
      letter-spacing: 1px;
    }

    /* Estrazione Numero */
    .extract-box {
      font-size: 4rem;
      font-weight: bold;
      color: var(--neon-cyan);
      text-shadow: 0 0 20px var(--neon-cyan);
      background: rgba(0, 0, 0, 0.5);
      border: 2px dashed var(--neon-cyan);
      border-radius: 10px;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0;
    }

    /* Pulsanti a Tema Anni 80 */
    .btn-neon {
      background: linear-gradient(45deg, #ff007f, #7f00ff);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--neon-pink);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 5px;
    }

    .btn-neon:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px var(--neon-pink), 0 0 30px var(--neon-cyan);
    }

    .btn-neon:active {
      transform: scale(0.95);
    }

    /* Tabellone Generale */
    .board {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      width: 100%;
      margin-top: 15px;
    }

    .cell {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      transition: all 0.3s;
    }

    .cell.extracted {
      background: var(--neon-cyan);
      color: #000;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
      transform: scale(1.05);
    }

    /* Controlli Audio in basso a destra */
    .audio-control-fixed {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(26, 11, 46, 0.95);
      border: 2px solid var(--neon-cyan);
      padding: 10px 15px;
      border-radius: 30px;
      box-shadow: 0 0 15px var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .audio-control-fixed button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* Overlay per la Vincita / Schermata Regia */
    #win-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 5, 29, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: fadeIn 0.5s ease;
    }

    #win-overlay h1 {
      font-size: 4rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 30px var(--neon-yellow);
      margin-bottom: 20px;
      animation: pulse 1s infinite alternate;
    }

    .winner-card-container {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    .winner-card {
      background: var(--panel-bg);
      border: 3px solid var(--neon-pink);
      box-shadow: 0 0 25px var(--neon-pink);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      width: 220px;
    }

    .winner-card img, .winner-card .caricature-placeholder {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid var(--neon-cyan);
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- ELEMENTI AUDIO MP3 LOCALI (Sottofondo Anni 80 & Tarara di Omul) -->
  <audio id="audio-medley-80s" loop src="medley80.mp3" preload="auto"></audio>
  <audio id="audio-tarara-omul" src="tarara.mp3" preload="auto"></audio>

  <h1>Tombola Anni 80</h1>
  <div class="subtitle">✨ Special Edition con Regia Audio & Visual ✨</div>

  <div class="main-container">
    <!-- Sezione Estrazione / Tabellone -->
    <div class="panel">
      <h2>Estrazione Numeri</h2>
      <div class="extract-box" id="current-number">--</div>
      <button class="btn-neon" onclick="estraiNumero()">Estrai Numero</button>
      <div style="margin-top: 15px;">
        <button class="btn-neon" style="background: linear-gradient(45deg, #00f3ff, #0077ff);" onclick="simulaVincita('ambo')">Simula Ambo/Terna</button>
        <button class="btn-neon" style="background: linear-gradient(45deg, #f3e600, #ff7700);" onclick="simulaVincita('tombola')">Simula TOMBOLA!</button>
      </div>
    </div>

    <!-- Tabellone Completo 1-90 -->
    <div class="panel" style="max-width: 600px;">
      <h2>Tabellone (1 - 90)</h2>
      <div class="board" id="board"></div>
    </div>
  </div>

  <!-- Overlay Schermata Vincita (Regia) -->
  <div id="win-overlay">
    <h1 id="win-title">🎉 TOMBOLA! 🎉</h1>
    <div class="winner-card-container" id="winner-cards-box">
      <!-- Generati dinamicamente via JS -->
    </div>
    <button class="btn-neon" onclick="chiudiVincita()">Torna al Gioco</button>
  </div>

  <!-- Barra Controlli Audio Fissa in Basso -->
  <div class="audio-control-fixed">
    <span id="audio-status-icon">🎵</span>
    <button id="audio-toggle-btn" onclick="toggleSottofondo()">Sottofondo 80s: DISATTIVATO</button>
  </div>

  <script>
    // Generazione Tabellone
    const boardElement = document.getElementById('board');
    const extractedNumbers = [];
    let numbersPool = Array.from({length: 90}, (_, i) => i + 1);

    for (let i = 1; i <= 90; i++) {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.textContent = i;
      cell.id = `cell-${i}`;
      boardElement.appendChild(cell);
    }

    function estraiNumero() {
      if (numbersPool.length === 0) {
        alert("Tutti i numeri sono stati estratti!");
        return;
      }
      const randomIndex = Math.floor(Math.random() * numbersPool.length);
      const extracted = numbersPool.splice(randomIndex, 1)[0];
      extractedNumbers.push(extracted);

      document.getElementById('current-number').textContent = extracted;
      document.getElementById(`cell-${extracted}`).classList.add('extracted');
    }

    // Gestione Audio
    const medleyAudio = document.getElementById('audio-medley-80s');
    const tararaAudio = document.getElementById('audio-tarara-omul');
    let isPlayingMedley = false;

    function toggleSottofondo() {
      const btn = document.getElementById('audio-toggle-btn');
      const icon = document.getElementById('audio-status-icon');

      if (!isPlayingMedley) {
        medleyAudio.play().then(() => {
          isPlayingMedley = true;
          btn.textContent = "Sottofondo 80s: ATTIVO";
          icon.textContent = "🔊";
        }).catch(err => {
          console.log("Errore riproduzione audio (interazione richiesta):", err);
          alert("Clicca sulla pagina prima di attivare l'audio.");
        });
      } else {
        medleyAudio.pause();
        isPlayingMedley = false;
        btn.textContent = "Sottofondo 80s: DISATTIVATO";
        icon.textContent = "🎵";
      }
    }

    // Funzione Regia Vincita
    function simulaVincita(tipo) {
      // 1. Ferma o abbassa temporaneamente il sottofondo se attivo
      if (isPlayingMedley) {
        medleyAudio.pause();
      }

      // 2. Fai partire la traccia "Tarara" di Omul
      tararaAudio.currentTime = 0;
      tararaAudio.play().catch(err => console.log("Errore riproduzione Tarara:", err));

      // 3. Imposta il titolo della vincita
      const winTitle = document.getElementById('win-title');
      if (tipo === 'tombola') {
        winTitle.textContent = "🏆 SUPER TOMBOLA! 🏆";
      } else {
        winTitle.textContent = "✨ FANTASTICA VINCITA! ✨";
      }

      // 4. Mostra fittiziamente alcuni vincitori con selfie/caricature di esempio
      const cardsBox = document.getElementById('winner-cards-box');
      cardsBox.innerHTML = `
        <div class="winner-card">
          <div class="caricature-placeholder">Caricatura 1</div>
          <strong>Giocatore 1</strong>
        </div>
        <div class="winner-card">
          <div class="caricature-placeholder">Caricatura 2</div>
          <strong>Giocatore 2</strong>
        </div>
      `;

      // 5. Mostra l'overlay grafico a schermo intero
      document.getElementById('win-overlay').style.display = 'flex';
    }

    function chiudiVincita() {
      // Ferma la musica della vincita
      tararaAudio.pause();
      tararaAudio.currentTime = 0;

      // Nascondi l'overlay
      document.getElementById('win-overlay').style.display = 'none';

      // Ripristina il sottofondo 80s se era attivo prima della vincita
      if (isPlayingMedley) {
        medleyAudio.play().catch(err => console.log("Ripresa medley fallita", err));
      }
    }
  </script>
</body>
</html>
